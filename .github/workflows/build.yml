name: Build & Release GestureWave AI

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v2.1.0)
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "numpy<2" pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        else { pip install requests opencv-python mediapipe pyautogui }

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name GestureWaveAI app.py

    - name: Compile Inno Setup Script
      run: |
        iscc installer.iss

    - name: Upload Artifact (Backup)
      uses: actions/upload-artifact@v4
      with:
        name: GestureWaveAI-Windows-Installer
        path: dist/GestureWaveAI_Installer.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/GestureWaveAI_Installer.exe
        name: GestureWave AI ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
